# =================================
# SISTEMA DE VENTAS MULTI-SUCURSAL
# =================================

spring.application.name=sistema-ventas

# Puerto dinámico (Render lo configura automáticamente)
server.port=${PORT:8080}

# =================================
# BASE DE DATOS - NEON POSTGRESQL
# =================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =================================
# JPA / HIBERNATE
# =================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =================================
# THYMELEAF (Producción)
# =================================
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8

# =================================
# SPRING SECURITY
# =================================
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# =================================
# LOGGING (Producción - menos logs)
# =================================
logging.level.com.empresa.sistema_ventas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# =================================
# ERROR HANDLING
# =================================
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# =================================
# JASPERREPORTS
# =================================
app.reports.path=classpath:/reports/
app.reports.output-dir=generated-reports

# =================================
# DEVTOOLS (DESACTIVADO EN PROD)
# =================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false