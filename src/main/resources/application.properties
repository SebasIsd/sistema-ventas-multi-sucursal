spring.application.name=sistema-ventas

# CONFIGURACIÓN DEL SERVIDOR
server.port=8081

# ============================================
# CONFIGURACIÓN BASE DE DATOS NEON POSTGRESQL
# ============================================

spring.datasource.url=jdbc:postgresql://localhost:5432/SISTEMA_VENTAS_DB
spring.datasource.username=postgres
spring.datasource.password=hitman4525
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURACIÓN JPA / HIBERNATE
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NO necesitas esto ya:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# THYMELEAF
# ============================================

spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8

# ============================================
# SPRING SECURITY
# ============================================

spring.security.user.name=admin
spring.security.user.password=admin123

# ============================================
# LOGGING
# ============================================

logging.level.com.empresa.sistema_ventas=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# ERROR HANDLING
# ============================================

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# DEVTOOLS
# ============================================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ============================================
# MENSAJES DE ERROR
# ============================================

server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# JASPERREPORTS
# ============================================

app.reports.path=classpath:/reports/
app.reports.output-dir=generated-reports