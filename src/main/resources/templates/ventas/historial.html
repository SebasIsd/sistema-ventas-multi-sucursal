<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Historial de Ventas — Sistema de Ventas')}">
</head>
<body class="role-cajero">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-cajero}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

            <!-- Breadcrumb -->
            <div class="breadcrumb-wrapper">
                <a th:href="@{/cajero/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
                <i class="bi bi-chevron-right sep"></i>
                <span class="current">Historial de Ventas</span>
            </div>

            <!-- Header -->
            <div class="page-header">
                <div>
                    <h2 class="page-title"><i class="bi bi-clock-history"></i> Historial de Ventas</h2>
                    <p class="page-desc">Registro completo de transacciones realizadas</p>
                </div>
            </div>

            <!-- Filtros de búsqueda -->
            <div class="card slide-up" style="margin-bottom:1.5rem;">
                <div class="card-body" style="padding:1.25rem 1.5rem;">
                    <form method="get" th:action="@{/ventas/historial}" class="row g-3 align-items-end" id="formFiltroHistorial">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-person-badge me-1"></i>Cédula del Cliente
                            </label>
                            <input type="text"
                                   name="cedula"
                                   id="filtro_cedula"
                                   class="form-control"
                                   placeholder="Ingrese cédula..."
                                   th:value="${cedula}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-calendar-event me-1"></i>Fecha Inicio
                            </label>
                            <input type="date"
                                   name="fechaInicio"
                                   id="filtro_fecha_inicio"
                                   class="form-control"
                                   th:value="${fechaInicio}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-calendar-check me-1"></i>Fecha Fin
                            </label>
                            <input type="date"
                                   name="fechaFin"
                                   id="filtro_fecha_fin"
                                   class="form-control"
                                   th:value="${fechaFin}">
                        </div>
                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-filled w-100">
                                <i class="bi bi-search"></i> Buscar
                            </button>
                            <a th:href="@{/ventas/historial}" class="btn btn-ghost" title="Limpiar filtros">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla de ventas -->
            <div class="card slide-up">
                <div class="card-body" style="padding:1.5rem;">
                    <div class="table-wrapper">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th width="80">ID</th>
                                    <th>Cliente</th>
                                    <th>Fecha</th>
                                    <th class="text-end">Subtotal</th>
                                    <th class="text-end">IVA</th>
                                    <th class="text-end">Total</th>
                                    <th class="text-center">Factura</th>
                                    <th class="text-center" width="100">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="venta : ${ventas}">
                                    <td><span class="text-muted fw-semibold" th:text="${'#' + venta.id}"></span></td>
                                    <td class="fw-semibold text-main"
                                        th:text="${venta.cliente != null ? venta.cliente.nombres + ' ' + venta.cliente.apellidos : 'Consumidor Final'}"></td>
                                    <td th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td class="text-end">
                                        <span th:text="${'$' + #numbers.formatDecimal(venta.subtotalSinIva, 0, 'COMMA', 2, 'POINT')}"></span>
                                    </td>
                                    <td class="text-end">
                                        <span th:text="${'$' + #numbers.formatDecimal(venta.ivaTotal, 0, 'COMMA', 2, 'POINT')}"></span>
                                    </td>
                                    <td class="text-end">
                                        <span class="price-tag" th:text="${'$' + #numbers.formatDecimal(venta.total, 0, 'COMMA', 2, 'POINT')}"></span>
                                    </td>
                                    <td class="text-center">
                                        <div class="d-flex gap-1 justify-content-center">
                                            <a class="btn btn-sm btn-outline-primary"
                                               th:href="@{/facturas/ver/{ventaId}(ventaId=${venta.id})}"
                                               title="Ver factura">
                                                <i class="bi bi-file-earmark-text"></i>
                                            </a>
                                            <a class="btn btn-sm btn-success"
                                               th:href="@{/facturas/descargar/{ventaId}(ventaId=${venta.id})}"
                                               title="Descargar PDF">
                                                <i class="bi bi-download"></i>
                                            </a>
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/ventas/detalle/{id}(id=${venta.id})}"
                                           class="btn btn-sm btn-icon-edit"
                                           title="Ver detalle">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Estado vacío -->
                    <div th:if="${ventas.isEmpty()}" style="text-align:center; padding:3rem 1rem;">
                        <i class="bi bi-receipt" style="font-size:3rem; color:#cbd5e1; margin-bottom:1rem;"></i>
                        <h5 style="color:var(--text-main); font-weight:600;">Sin ventas</h5>
                        <p style="color:var(--text-muted); font-size:.9rem;">No se encontraron ventas con los filtros aplicados.</p>
                    </div>
                </div>
            </div>

            <!-- Paginación -->
            <div class="d-flex justify-content-center mt-4" th:if="${ventas.totalPages > 1}">
                <nav>
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/ventas/historial(page=${currentPage - 1}, cedula=${cedula}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}">
                                <i class="bi bi-chevron-left"></i> Anterior
                            </a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, ventas.totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                               th:href="@{/ventas/historial(page=${i}, cedula=${cedula}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 >= ventas.totalPages} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/ventas/historial(page=${currentPage + 1}, cedula=${cedula}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}">
                                Siguiente <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Footer -->
            <div th:replace="~{layout/base :: footer}"></div>
        </div>
    </div>
</div>

<!-- Scripts -->
<div th:replace="~{layout/base :: scripts}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('formFiltroHistorial');
        if (form) {
            form.addEventListener('submit', function (e) {
                const inputCedula = document.getElementById('filtro_cedula');
                const inputFechaInicio = document.getElementById('filtro_fecha_inicio');
                const inputFechaFin = document.getElementById('filtro_fecha_fin');

                const cedula = inputCedula.value.trim();
                const fechaInicioVal = inputFechaInicio.value;
                const fechaFinVal = inputFechaFin.value;

                inputCedula.value = cedula;

                // Validar Cédula si se ingresa
                if (cedula !== "") {
                    if (!/^\d+$/.test(cedula)) {
                        e.preventDefault();
                        showToast('error', 'La cédula para buscar debe contener únicamente números.');
                        return;
                    }
                    if (cedula.length > 13) {
                        e.preventDefault();
                        showToast('error', 'La cédula o RUC no puede exceder los 13 dígitos.');
                        return;
                    }
                }

                // Validar Fechas
                if (fechaInicioVal && fechaFinVal) {
                    const dateInicio = new Date(fechaInicioVal);
                    const dateFin = new Date(fechaFinVal);
                    if (dateInicio > dateFin) {
                        e.preventDefault();
                        showToast('error', 'La Fecha Inicio no puede ser posterior a la Fecha Fin.');
                        return;
                    }
                }

                if (fechaFinVal) {
                    const dateFin = new Date(fechaFinVal);
                    const today = new Date();
                    // Reset hours to compare only date parts
                    today.setHours(0,0,0,0);
                    if (dateFin > today) {
                        e.preventDefault();
                        showToast('error', 'La Fecha Fin no puede ser superior a la fecha actual.');
                        return;
                    }
                }
            });
        }
    });
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function () {
        const errorMsg = /*[[${errorMessage}]]*/ null;
        const successMsg = /*[[${successMessage}]]*/ null;
        const msg = /*[[${mensaje}]]*/ null;
        const tipoMsg = /*[[${tipoMensaje}]]*/ null;

        if (errorMsg) {
            showToast('error', errorMsg);
        }
        if (successMsg) {
            showToast('success', successMsg);
        }
        if (msg) {
            showToast(tipoMsg === 'success' ? 'success' : 'error', msg);
        }
    });
    /*]]>*/
</script>
</body>
</html>
