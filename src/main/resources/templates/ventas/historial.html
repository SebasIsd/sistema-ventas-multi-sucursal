<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Historial de Ventas — Sistema de Ventas')}">
</head>
<body class="role-cajero">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-cajero}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

                <!-- Breadcrumb -->
                <div class="breadcrumb-wrapper">
                    <a th:href="@{/cajero/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
                    <i class="bi bi-chevron-right sep"></i>
                    <span class="current">Historial de Ventas</span>
                </div>

                <!-- Header -->
                <div class="page-header">
                    <div>
                        <h2 class="page-title"><i class="bi bi-clock-history"></i> Historial de Ventas</h2>
                        <p class="page-desc">Registro completo de transacciones realizadas</p>
                    </div>
                </div>

                <div class="card slide-up">
                    <div class="card-body" style="padding:1.5rem;">
                        <div class="table-wrapper">
                            <table class="table align-middle">
                                <thead style="background:var(--primary);">
                                    <tr>
                                        <th width="80">ID</th>
                                        <th>Cliente</th>
                                        <th>Fecha</th>
                                        <th class="text-end">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="venta : ${ventas}">
                                        <td><span class="text-muted fw-semibold" th:text="${'#' + venta.id}"></span></td>
                                        <td class="fw-semibold text-main" th:text="${venta.cliente != null ? venta.cliente.nombres + ' ' + venta.cliente.apellidos : 'Consumidor Final'}"></td>
                                        <td th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                        <td class="text-end"><span class="price-tag" th:text="${#numbers.formatCurrency(venta.total)}"></span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Estado Vacío si no hay ventas -->
                        <div th:if="${#lists.isEmpty(ventas)}" style="text-align:center; padding:3rem 1rem;">
                            <i class="bi bi-receipt" style="font-size:3rem; color:#cbd5e1; margin-bottom:1rem;"></i>
                            <h5 style="color:var(--text-main); font-weight:600;">Sin ventas</h5>
                            <p style="color:var(--text-muted); font-size:.9rem;">No se han registrado ventas aún.</p>
                        </div>
                    </div>
                </div>

                <!-- FOOTER MODULAR -->
    <div th:replace="~{layout/base :: footer}"></div>
    </div>
    </div>
</div>
<!-- SCRIPTS MODULAR -->
    <div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
