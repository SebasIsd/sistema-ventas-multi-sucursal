<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Detalle de Venta — Sistema de Ventas')}">
</head>
<body class="role-cajero">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-cajero}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

            <!-- Breadcrumb -->
            <div class="breadcrumb-wrapper">
                <a th:href="@{/cajero/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
                <i class="bi bi-chevron-right sep"></i>
                <a th:href="@{/ventas/historial}">Historial de Ventas</a>
                <i class="bi bi-chevron-right sep"></i>
                <span class="current" th:text="'Venta #' + ${venta.id}">Detalle</span>
            </div>

            <!-- Header -->
            <div class="page-header">
                <div>
                    <h2 class="page-title">
                        <i class="bi bi-receipt-cutoff"></i>
                        Detalle de Venta
                        <span class="text-muted" style="font-size:.8em;" th:text="'#' + ${venta.id}"></span>
                    </h2>
                    <p class="page-desc">
                        Registrada el
                        <span th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}"></span>
                    </p>
                </div>
                <a th:href="@{/ventas/historial}" class="btn btn-ghost">
                    <i class="bi bi-arrow-left"></i> Volver al Historial
                </a>
            </div>

            <div class="row g-4">

                <!-- Info cliente -->
                <div class="col-md-6">
                    <div class="card slide-up">
                        <div class="card-body" style="padding:1.5rem;">
                            <h6 style="font-weight:700; color:var(--text-main); margin-bottom:1rem;">
                                <i class="bi bi-person-check" style="color:var(--primary);"></i> Información del Cliente
                            </h6>
                            <div class="row g-2">
                                <div class="col-12">
                                    <span class="text-muted" style="font-size:.85rem;">Nombre</span>
                                    <div class="fw-semibold"
                                         th:text="${venta.cliente != null ? venta.cliente.nombres + ' ' + venta.cliente.apellidos : 'Consumidor Final'}">
                                    </div>
                                </div>
                                <div class="col-6" th:if="${venta.cliente != null}">
                                    <span class="text-muted" style="font-size:.85rem;">Cédula/RUC</span>
                                    <div class="fw-semibold" th:text="${venta.cliente.cedulaRuc}"></div>
                                </div>
                                <div class="col-6" th:if="${venta.cliente != null and venta.cliente.telefono != null}">
                                    <span class="text-muted" style="font-size:.85rem;">Teléfono</span>
                                    <div class="fw-semibold" th:text="${venta.cliente.telefono}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resumen financiero -->
                <div class="col-md-6">
                    <div class="card slide-up">
                        <div class="card-body" style="padding:1.5rem;">
                            <h6 style="font-weight:700; color:var(--text-main); margin-bottom:1rem;">
                                <i class="bi bi-calculator" style="color:var(--primary);"></i> Resumen Financiero
                            </h6>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal sin IVA:</span>
                                <span class="fw-semibold"
                                      th:text="${'$' + #numbers.formatDecimal(venta.subtotalSinIva, 0, 'COMMA', 2, 'POINT')}">
                                </span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">IVA (15%):</span>
                                <span class="fw-semibold"
                                      th:text="${'$' + #numbers.formatDecimal(venta.ivaTotal, 0, 'COMMA', 2, 'POINT')}">
                                </span>
                            </div>
                            <hr style="margin:.75rem 0;">
                            <div class="d-flex justify-content-between align-items-center">
                                <span style="font-weight:700; font-size:1.1rem;">Total:</span>
                                <span class="price-tag"
                                      th:text="${'$' + #numbers.formatDecimal(venta.total, 0, 'COMMA', 2, 'POINT')}">
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabla de productos -->
                <div class="col-12">
                    <div class="card slide-up">
                        <div class="card-body" style="padding:1.5rem;">
                            <h6 style="font-weight:700; color:var(--text-main); margin-bottom:1rem;">
                                <i class="bi bi-box-seam" style="color:var(--primary);"></i> Productos Vendidos
                            </h6>

                            <div class="table-wrapper">
                                <table class="table align-middle">
                                    <thead>
                                        <tr>
                                            <th>Producto</th>
                                            <th class="text-center" width="100">Cantidad</th>
                                            <th class="text-end" width="130">Precio Unit.</th>
                                            <th class="text-end" width="130">Subtotal</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="detalle : ${venta.detalles}">
                                            <td class="fw-semibold text-main" th:text="${detalle.producto.nombre}">Producto</td>
                                            <td class="text-center">
                                                <span class="badge bg-light text-dark border fw-bold"
                                                      th:text="${detalle.cantidad}">0</span>
                                            </td>
                                            <td class="text-end"
                                                th:text="${'$' + #numbers.formatDecimal(detalle.precioUnitario, 0, 'COMMA', 2, 'POINT')}">
                                            </td>
                                            <td class="text-end fw-bold price-tag"
                                                th:text="${'$' + #numbers.formatDecimal(detalle.subtotal, 0, 'COMMA', 2, 'POINT')}">
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div th:replace="~{layout/base :: footer}"></div>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
