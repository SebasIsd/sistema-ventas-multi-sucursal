<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Venta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background:#f5f7fa;">

<div class="container mt-5">

    <div class="card shadow p-4">

        <div class="d-flex justify-content-between mb-4">

            <h2>
                Detalle Venta
            </h2>

            <a th:href="@{/ventas/historial}"
               class="btn btn-secondary">

                Volver

            </a>

        </div>

        <div class="mb-3">

            <strong>ID Venta:</strong>

            <span th:text="${venta.id}"></span>

        </div>

        <div class="mb-3">

            <strong>Cliente:</strong>

            <span th:text="${venta.cliente.nombres + ' ' + venta.cliente.apellidos}">
            </span>

        </div>

        <div class="mb-3">

            <strong>Fecha:</strong>

            <span th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}">
            </span>

        </div>

        <hr>

        <table class="table table-bordered">

            <thead class="table-dark">

            <tr>

                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Subtotal</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="detalle : ${venta.detalles}">

                <td th:text="${detalle.producto.nombre}">
                </td>

                <td th:text="${detalle.cantidad}">
                </td>

                <td th:text="${'$' + detalle.precioUnitario}">
                </td>

                <td th:text="${'$' + detalle.subtotal}">
                </td>

            </tr>

            </tbody>

        </table>

        <div class="text-end mt-4">

            <h4>

                Total:

                <span th:text="${'$' + venta.total}">
                </span>

            </h4>

        </div>

    </div>

</div>

</body>
</html>
