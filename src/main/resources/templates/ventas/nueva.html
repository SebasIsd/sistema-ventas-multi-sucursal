<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Nueva Venta — Sistema de Ventas')}">
</head>
<body class="role-cajero">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-cajero}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

                <!-- Breadcrumb -->
                <div class="breadcrumb-wrapper">
                    <a th:href="@{/cajero/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
                    <i class="bi bi-chevron-right sep"></i>
                    <span class="current">Nueva Venta</span>
                </div>

                <!-- Header -->
                <div class="page-header">
                    <div>
                        <h2 class="page-title"><i class="bi bi-cart-plus"></i> Nueva Venta</h2>
                        <p class="page-desc">Registrar ventas y descontar stock automáticamente</p>
                    </div>
                </div>

                <!-- FORMULARIO -->
                <form th:action="@{/ventas/procesar}" method="post">
                    <div class="row g-4">
                        <!-- CLIENTE -->
                        <div class="col-12">
                            <div class="card slide-up">
                                <div class="card-body" style="padding:1.5rem;">
                                    <h5 class="card-title mb-3" style="font-weight:700; color:var(--text-main);">
                                        <i class="bi bi-person-check" style="color:var(--primary); margin-right:.5rem;"></i> Cliente
                                    </h5>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="form-label">Seleccionar Cliente</label>
                                            <div class="input-group">
                                                <select name="clienteId" id="clienteId" class="form-select" required>
                                                    <option value="">-- Seleccione un cliente --</option>
                                                    <option th:each="cliente : ${clientes}"
                                                            th:value="${cliente.id}"
                                                            th:text="${cliente.nombres + ' ' + cliente.apellidos + ' (' + cliente.cedulaRuc + ')'}">
                                                    </option>
                                                </select>
                                                <button type="button"
                                                        class="btn btn-ghost"
                                                        data-bs-toggle="modal"
                                                        data-bs-target="#modalNuevoCliente"
                                                        title="Crear nuevo cliente">
                                                    <i class="bi bi-person-plus"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- PRODUCTOS -->
                        <div class="col-12">
                            <div class="card slide-up" style="animation-delay: 0.1s;">
                                <div class="card-body" style="padding:1.5rem;">
                                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                                        <h5 class="card-title m-0" style="font-weight:700; color:var(--text-main);">
                                            <i class="bi bi-box-seam" style="color:var(--primary); margin-right:.5rem;"></i> Productos
                                        </h5>
                                        <button type="button" class="btn btn-filled" onclick="agregarFila()">
                                            <i class="bi bi-plus-lg"></i> Agregar Producto
                                        </button>
                                    </div>

                                    <div class="table-wrapper">
                                        <table class="table align-middle" id="tablaProductos">
                                            <thead>
                                                <tr>
                                                    <th>Producto</th>
                                                    <th width="100" class="text-center">Stock</th>
                                                    <th width="120" class="text-end">Precio</th>
                                                    <th width="120">Cantidad</th>
                                                    <th width="120" class="text-end">Subtotal</th>
                                                    <th width="80" class="text-center">Acción</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tbodyProductos">
                                                <tr>
                                                    <td>
                                                        <select name="items[0].productoId" class="form-select producto-select" onchange="actualizarFila(this)" required>
                                                            <option value="">-- Seleccione producto --</option>
                                                            <option th:each="inv : ${inventarios}"
                                                                    th:value="${inv.producto.idProducto}"
                                                                    th:text="${inv.producto.nombre}">
                                                            </option>
                                                        </select>
                                                    </td>
                                                    <td class="text-center">
                                                        <span class="badge bg-light text-dark border stock-text">0</span>
                                                    </td>
                                                    <td class="text-end fw-bold text-main precio-text">$0.00</td>
                                                    <td>
                                                        <input type="number" name="items[0].cantidad" class="form-control cantidad-input" min="1" value="1" oninput="calcularTotales()" required>
                                                    </td>
                                                    <td class="text-end fw-bold text-success subtotal-text">$0.00</td>
                                                    <td class="text-center">
                                                        <button type="button" class="btn btn-sm btn-icon-delete" onclick="eliminarFila(this)">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>

                                    <div class="d-flex justify-content-end mt-4">
                                        <div class="card" style="min-width: 300px; background: #f8fafc; border: 1px solid var(--border);">
                                            <div class="card-body p-3">
                                                <div class="d-flex justify-content-between mb-2">
                                                    <span class="text-muted">Subtotal:</span>
                                                    <span id="subtotalGeneral" class="fw-bold text-main">$0.00</span>
                                                </div>
                                                <div class="d-flex justify-content-between mb-2">
                                                    <span class="text-muted">IVA (15%):</span>
                                                    <span id="ivaGeneral" class="fw-bold text-main">$0.00</span>
                                                </div>
                                                <hr class="my-2">
                                                <div class="d-flex justify-content-between align-items-center">
                                                    <span class="h6 mb-0" style="font-weight: 700;">Total:</span>
                                                    <span id="totalGeneral" class="h5 mb-0" style="font-weight: 800; color: var(--primary);">$0.00</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- BOTONES -->
                        <div class="col-12 mb-4">
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-filled px-4">
                                    <i class="bi bi-cash-coin me-2"></i> Procesar Venta
                                </button>
                                <a th:href="@{/cajero/dashboard}" class="btn btn-ghost px-4">
                                    <i class="bi bi-arrow-left me-2"></i> Cancelar
                                </a>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- FOOTER MODULAR -->
    <div th:replace="~{layout/base :: footer}"></div>
    </div>
    </div>
</div>
<!-- SCRIPTS MODULAR -->
    <div th:replace="~{layout/base :: scripts}"></div>

    <script th:inline="javascript">
        let contador = 1;
        const IVA = 0.15;

        // PRODUCTOS CON STOCK
        const productos = [
            /*[# th:each="inv : ${inventarios}"]*/
            {
                id: [[${inv.producto.idProducto}]],
                nombre: [[${inv.producto.nombre}]],
                precio: [[${inv.producto.precioUnitario}]],
                stock: [[${inv.stockActual}]]
            },
            /*[/]*/
        ];

        function generarOpciones(){
            let opciones = '<option value="">-- Seleccione producto --</option>';
            productos.forEach(producto => {
                opciones += `<option value="${producto.id}">${producto.nombre}</option>`;
            });
            return opciones;
        }

        function actualizarFila(select){
            const fila = select.closest("tr");
            const producto = productos.find(p => p.id == select.value);

            if(!producto){
                fila.querySelector(".stock-text").innerText = "0";
                fila.querySelector(".precio-text").innerText = "$0.00";
                return;
            }

            fila.querySelector(".stock-text").innerText = producto.stock;
            fila.querySelector(".precio-text").innerText = formatCurrency(producto.precio);

            calcularTotales();
        }

        function calcularTotales(){
            let subtotal = 0;
            document.querySelectorAll("#tbodyProductos tr").forEach(fila => {
                const select = fila.querySelector(".producto-select");
                const cantidadInput = fila.querySelector(".cantidad-input");
                const subtotalText = fila.querySelector(".subtotal-text");
                const producto = productos.find(p => p.id == select.value);

                if(!producto){
                    subtotalText.innerText = "$0.00";
                    return;
                }

                let cantidad = parseInt(cantidadInput.value) || 0;

                // VALIDAR STOCK
                if(cantidad > producto.stock){
                    cantidad = producto.stock;
                    cantidadInput.value = producto.stock;
                    showToast('warning', 'Stock insuficiente para este producto');
                }

                const subtotalFila = cantidad * producto.precio;
                subtotal += subtotalFila;
                subtotalText.innerText = formatCurrency(subtotalFila);
            });

            const iva = subtotal * IVA;
            const total = subtotal + iva;

            document.getElementById("subtotalGeneral").innerText = formatCurrency(subtotal);
            document.getElementById("ivaGeneral").innerText = formatCurrency(iva);
            document.getElementById("totalGeneral").innerText = formatCurrency(total);
        }

        function agregarFila(){
            const tbody = document.getElementById("tbodyProductos");
            const fila = document.createElement("tr");

            fila.innerHTML = `
                <td>
                    <select name="items[${contador}].productoId" class="form-select producto-select" onchange="actualizarFila(this)" required>
                        ${generarOpciones()}
                    </select>
                </td>
                <td class="text-center">
                    <span class="badge bg-light text-dark border stock-text">0</span>
                </td>
                <td class="text-end fw-bold text-main precio-text">$0.00</td>
                <td>
                    <input type="number" name="items[${contador}].cantidad" class="form-control cantidad-input" min="1" value="1" oninput="calcularTotales()" required>
                </td>
                <td class="text-end fw-bold text-success subtotal-text">$0.00</td>
                <td class="text-center">
                    <button type="button" class="btn btn-sm btn-icon-delete" onclick="eliminarFila(this)">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;

            tbody.appendChild(fila);
            contador++;
        }

        function eliminarFila(btn){
            const tbody = document.getElementById("tbodyProductos");
            if(tbody.rows.length > 1) {
                btn.closest("tr").remove();
                calcularTotales();
            } else {
                showToast('info', 'Debe haber al menos un producto en la venta');
            }
        }
    </script>
</div>

<!-- MODAL: Nuevo Cliente Rápido -->
<div class="modal fade" id="modalNuevoCliente" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border:none; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.15);">
            <div class="modal-header" style="border-bottom:1px solid var(--border); padding:1.25rem 1.5rem;">
                <h5 class="modal-title">
                    <i class="bi bi-person-plus" style="color:var(--primary); margin-right:.5rem;"></i>
                    Nuevo Cliente
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/clientes/guardar-rapido}" method="post">
                <div class="modal-body" style="padding:1.5rem;">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombres *</label>
                            <input type="text" name="nombres" class="form-control" required placeholder="Juan">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Apellidos *</label>
                            <input type="text" name="apellidos" class="form-control" required placeholder="Pérez">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Cédula / RUC *</label>
                            <input type="text" name="cedulaRuc" class="form-control" required placeholder="1712345678">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" placeholder="0999999999">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="cliente@email.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Dirección</label>
                            <input type="text" name="direccion" class="form-control" placeholder="Av. Principal 123">
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="border-top:1px solid var(--border); padding:1.25rem 1.5rem;">
                    <button class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-filled">
                        <i class="bi bi-floppy"></i> Guardar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
