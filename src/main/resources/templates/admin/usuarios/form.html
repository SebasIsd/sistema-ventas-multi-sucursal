<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${modo == 'crear' ? 'Nuevo Usuario' : 'Editar Usuario'})}">
</head>
<body class="role-admin">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-admin}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="fas fa-user-cog me-2"></i>
            <span th:text="${modo == 'crear' ? 'Nuevo Usuario' : 'Editar Usuario'}">Formulario</span>
        </h2>
        <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Volver
        </a>
    </div>

    <!-- Formulario -->
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post">

                <!-- ID oculto para edición -->
                <input type="hidden" th:field="*{id}">

                <div class="row g-4">

                    <!-- Columna Izquierda: Datos de Acceso -->
                    <div class="col-lg-6">
                        <h5 class="mb-3 pb-2 border-bottom">
                            <i class="fas fa-key me-2"></i>Datos de Acceso
                        </h5>

                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario *</label>
                            <input type="text"
                                   id="username"
                                   class="form-control"
                                   th:field="*{username}"
                                   required
                                   th:readonly="${modo == 'editar'}"
                                   th:classappend="${modo == 'editar'} ? 'bg-light'"
                                   placeholder="ej. juan.perez">
                            <small class="text-muted" th:if="${modo == 'editar'}">
                                <i class="fas fa-lock me-1"></i>No se puede modificar
                            </small>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Contraseña
                                <span th:if="${modo == 'editar'}" class="text-muted">(dejar vacío para mantener)</span>
                                <span th:if="${modo == 'crear'}" class="text-danger">*</span>
                            </label>
                            <input type="password"
                                   id="password"
                                   class="form-control"
                                   name="password"
                                   th:required="${modo == 'crear'}"
                                   minlength="6"
                                   autocomplete="new-password">
                            <small class="text-muted">
                                <span th:if="${modo == 'editar'}">Mínimo 6 caracteres si desea cambiarla</span>
                                <span th:if="${modo == 'crear'}">Mínimo 6 caracteres</span>
                            </small>
                        </div>

                        <!-- Columna Derecha: Datos Personales -->
                        <div class="col-lg-6">
                            <h5 class="mb-3 pb-2 border-bottom">
                                <i class="fas fa-id-card me-2"></i>Datos Personales
                            </h5>

                            <div class="mb-3">
                                <label for="nombreCompleto" class="form-label">Nombre Completo *</label>
                                <input type="text"
                                       id="nombreCompleto"
                                       class="form-control"
                                       th:field="*{nombreCompleto}"
                                       required
                                       placeholder="Juan Pérez García">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email"
                                       id="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       required
                                       placeholder="juan.perez@empresa.com">
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel"
                                       id="telefono"
                                       class="form-control"
                                       th:field="*{telefono}"
                                       placeholder="0999999999"
                                       pattern="[0-9]{10}">
                            </div>
                        </div>
                    </div>

                    <!-- Fila: Rol y Sucursal -->
                    <div class="row g-4 mt-2">
                        <div class="col-lg-6">
                            <h5 class="mb-3 pb-2 border-bottom">
                                <i class="fas fa-user-tag me-2"></i>Asignación
                            </h5>

                            <div class="mb-3">
                                <label for="rolId" class="form-label">Rol *</label>
                                <select id="rolId"
                                        class="form-select"
                                        name="rolId"
                                        required>
                                    <option value="">Seleccionar Rol...</option>
                                    <option th:each="rol : ${roles}"
                                            th:value="${rol.id}"
                                            th:text="${rol.nombre}"
                                            th:selected="${usuario.rol != null && usuario.rol.id == rol.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="sucursalId" class="form-label">Sucursal</label>
                                <select id="sucursalId"
                                        class="form-select"
                                        name="sucursalId">
                                    <option value="">Sin sucursal específica</option>
                                    <option th:each="suc : ${sucursales}"
                                            th:value="${suc.id}"
                                            th:text="${suc.ciudad}"
                                            th:selected="${usuario.sucursal != null && usuario.sucursal.id == suc.id}">
                                    </option>
                                </select>
                                <small class="text-muted">Dejar vacío para acceso global (solo ADMIN)</small>
                            </div>
                        </div>

                        <!-- Columna: Estado -->
                        <div class="col-lg-6">
                            <h5 class="mb-3 pb-2 border-bottom">
                                <i class="fas fa-toggle-on me-2"></i>Estado
                            </h5>

                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           role="switch"
                                           id="activo"
                                           th:field="*{activo}"
                                           checked>
                                    <label class="form-check-label" for="activo">
                                        Usuario Activo
                                    </label>
                                </div>
                                <small class="text-muted">
                                    <i class="fas fa-info-circle me-1"></i>
                                    Los usuarios inactivos no podrán iniciar sesión
                                </small>
                            </div>

                            <!-- Info de creación/edición -->
                            <div th:if="${modo == 'editar' && usuario.id != null}" class="alert alert-info small">
                                <i class="fas fa-info-circle me-2"></i>
                                <strong>Creado:</strong>
                                <span th:text="${#temporals.format(usuario.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                        <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>
                            <span th:text="${modo == 'crear' ? 'Crear Usuario' : 'Actualizar Usuario'}">Guardar</span>
                        </button>
                    </div>

            </form>
        </div>
    </div>

    <div th:replace="~{layout/base :: footer}"></div>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>

<!-- Script para toggle de password (inline, ya que script.js está vacío) -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function () {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            });
        }
    });
</script>

</body>
</html>
