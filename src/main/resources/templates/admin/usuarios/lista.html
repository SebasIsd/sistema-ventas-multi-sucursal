<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Usuarios</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-primary" th:href="@{/admin/usuarios/nuevo}">Nuevo Usuario</a>
            <a class="btn btn-outline-secondary" th:href="@{/admin/dashboard}">Volver</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Activo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                </tr>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.rol != null ? u.rol.nombre : 'SIN ROL'}"></td>
                    <td>
                        <span class="badge" th:classappend="${u.activo} ? ' bg-success' : ' bg-secondary'"
                              th:text="${u.activo} ? 'SI' : 'NO'"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
