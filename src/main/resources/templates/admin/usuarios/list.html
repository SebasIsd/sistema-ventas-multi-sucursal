<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Gestión de Usuarios')}">
</head>
<body class="role-admin">

<!-- Navbar de Admin -->
<nav th:replace="~{layout/base :: navbar-admin}"></nav>

<div class="page-content">

    <!-- Header con título y acciones -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-users me-2"></i>Gestión de Usuarios</h2>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Nuevo Usuario
        </a>
    </div>

    <!-- Mensajes Flash (éxito/error) -->
    <div th:if="${mensaje}" class="alert alert-${tipoMensaje} alert-dismissible fade show mb-4" role="alert">
        <i class="fas fa-info-circle me-2"></i>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de usuarios -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Usuario</th>
                        <th>Nombre Completo</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Sucursal</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${usuarios}">
                        <td class="ps-4 fw-bold" th:text="${user.username}">admin</td>
                        <td th:text="${user.nombreCompleto}">Administrador General</td>
                        <td th:text="${user.email}">admin@sistema.com</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${user.rol.nombre}">ADMIN</span>
                        </td>
                        <td th:text="${user.sucursal != null ? user.sucursal.ciudad : '-'}">Quito</td>
                        <td>
                            <span th:if="${user.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${user.activo}" class="badge bg-danger">Inactivo</span>
                        </td>
                        <td class="text-center">
                            <!-- Botón Editar -->
                            <a th:href="@{/admin/usuarios/editar/{id}(id=${user.id})}"
                               class="btn btn-outline-primary btn-sm me-1"
                               title="Editar">
                                <i class="fas fa-edit"></i>
                            </a>

                            <!-- Botón Eliminar (AHORA CON FORM POST) -->
                            <form th:action="@{/admin/usuarios/eliminar/{id}(id=${user.id})}"
                                  method="post"
                                  style="display: inline;"
                                  onsubmit="return confirm('¿Estás seguro de eliminar este usuario?\n\n' + 'Esta acción NO se puede deshacer.');">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Eliminar">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>

                    <!-- Estado vacío -->
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="fas fa-users fa-3x mb-3 d-block"></i>
                            <p class="mb-0">No hay usuarios registrados en el sistema.</p>
                            <small>Comienza creando un nuevo usuario.</small>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Paginación (opcional, si implementas Pageable) -->
    <div th:if="${usuarios.totalPages > 1}" class="d-flex justify-content-center mt-4">
        <nav>
            <ul class="pagination pagination-sm">
                <li class="page-item" th:classappend="${usuarios.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/usuarios(page=${usuarios.number - 1})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, usuarios.totalPages - 1)}"
                    th:classappend="${i == usuarios.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/usuarios(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${usuarios.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/usuarios(page=${usuarios.number + 1})}">Siguiente</a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<!-- Footer y Scripts -->
<div th:replace="~{layout/base :: footer}"></div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
