<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Ajustar Stock — Admin')}"></head>
<body class="role-admin">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-admin}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

    <div class="breadcrumb-wrapper">
        <a th:href="@{/admin/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
        <i class="bi bi-chevron-right sep"></i>
        <a th:href="@{/admin/inventario}">Inventario</a>
        <i class="bi bi-chevron-right sep"></i>
        <span class="current">Ajustar</span>
    </div>

    <div class="page-header">
        <div>
            <h2 class="page-title"><i class="bi bi-sliders"></i> Ajustar stock</h2>
            <p class="page-desc">Incrementar inventario en cualquier sucursal</p>
        </div>
    </div>

    <div class="card slide-up" style="max-width:560px;">
        <div class="card-body" style="padding:1.5rem;">
            <form th:action="@{/admin/inventario/ajustar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Producto</label>
                    <select name="productoId" class="form-select" required>
                        <option value="">-- Seleccione --</option>
                        <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sucursal</label>
                    <select name="sucursalId" class="form-select" required>
                        <option value="">-- Seleccione --</option>
                        <option th:each="s : ${sucursales}" th:value="${s.id}" th:text="${s.ciudad + ' (' + s.codigo + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cantidad a aumentar</label>
                    <input type="number" name="cantidad" class="form-control" min="1" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-filled">Guardar ajuste</button>
                    <a th:href="@{/admin/inventario}" class="btn btn-ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{layout/base :: footer}"></div>
    </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
