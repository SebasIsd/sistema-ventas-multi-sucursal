<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Ajustar Stock</title>
  <meta charset="UTF-8">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Ajustar Stock</h4>
    </div>

    <div class="card-body">

      <form th:action="@{/admin/inventario/ajustar}" method="post">

        <div class="mb-3">
          <label class="form-label">ID Producto</label>
          <input type="number" name="productoId" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">ID Sucursal</label>
          <input type="number" name="sucursalId" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Cantidad a aumentar</label>
          <input type="number" name="cantidad" class="form-control" min="1" required>
        </div>

        <button type="submit" class="btn btn-primary">
          Guardar Ajuste
        </button>

        <a href="/admin/inventario" class="btn btn-secondary">
          Cancelar
        </a>

      </form>

    </div>
  </div>

</div>

</body>
</html>
