<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Ajustar Stock</title>
  <meta charset="UTF-8">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Ajustar Stock</h4>
    </div>

    <div class="card-body">

      <form th:action="@{/admin/inventario/ajustar}" method="post">

        <div class="mb-3">
          <label class="form-label">Producto</label>

          <input list="listaProductos"
                 id="productoTexto"
                 class="form-control"
                 placeholder="Escriba el nombre del producto"
                 required>

          <input type="hidden" name="productoId" id="productoId">

          <datalist id="listaProductos">
            <option th:each="producto : ${productos}"
                    th:value="${producto.nombre}"
                    th:attr="data-id=${producto.idProducto}">
            </option>
          </datalist>
        </div>

        <div class="mb-3">
          <label class="form-label">Sucursal</label>

          <input list="listaSucursales"
                 id="sucursalTexto"
                 class="form-control"
                 placeholder="Escriba la ciudad de la sucursal"
                 required>

          <input type="hidden" name="sucursalId" id="sucursalId">

          <datalist id="listaSucursales">
            <option th:each="sucursal : ${sucursales}"
                    th:value="${sucursal.ciudad}"
                    th:attr="data-id=${sucursal.id}">
            </option>
          </datalist>
        </div>

        <div class="mb-3">
          <label class="form-label">Cantidad a aumentar</label>
          <input type="number" name="cantidad" class="form-control" min="1" required>
        </div>

        <button type="submit" class="btn btn-primary">
          Guardar Ajuste
        </button>

        <a href="/admin/inventario" class="btn btn-secondary">
          Cancelar
        </a>

      </form>

    </div>
  </div>

</div>

<script>
  function asignarId(inputId, hiddenId, datalistId) {
      const input = document.getElementById(inputId);
      const hidden = document.getElementById(hiddenId);
      const opciones = document.querySelectorAll(`#${datalistId} option`);

      input.addEventListener('input', function () {
          hidden.value = "";

          opciones.forEach(function (opcion) {
              if (opcion.value === input.value) {
                  hidden.value = opcion.getAttribute("data-id");
              }
          });
      });
  }

  asignarId("productoTexto", "productoId", "listaProductos");
  asignarId("sucursalTexto", "sucursalId", "listaSucursales");
</script>

</body>
</html>
