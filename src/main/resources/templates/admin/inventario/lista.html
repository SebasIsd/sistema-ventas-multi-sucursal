<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventario</title>
    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Inventario</h2>

        <a href="/admin/dashboard" class="btn btn-secondary">
            Volver
        </a>

        <a href="/admin/inventario/ajustar" class="btn btn-primary">
            Ajustar Stock
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Sucursal</th>
                    <th>Stock Actual</th>
                    <th>Stock Mínimo</th>
                    <th>Estado</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="inv : ${inventarios}">
                    <td th:text="${inv.id}"></td>
                    <td th:text="${inv.producto.nombre}"></td>
                    <td th:text="${inv.sucursal.ciudad}"></td>
                    <td th:text="${inv.stockActual}"></td>
                    <td th:text="${inv.stockMinimo}"></td>
                    <td>
                        <span th:if="${inv.stockActual > inv.stockMinimo}"
                              class="badge bg-success">
                            Disponible
                        </span>

                        <span th:if="${inv.stockActual <= inv.stockMinimo}"
                              class="badge bg-danger">
                            Stock Bajo
                        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(inventarios)}">
                    <td colspan="6" class="text-center">
                        No hay registros de inventario.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
