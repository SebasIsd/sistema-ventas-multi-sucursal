<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Nueva Sucursal — Admin')}"></head>
<body class="role-admin">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-admin}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

    <div class="breadcrumb-wrapper">
        <a th:href="@{/admin/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
        <i class="bi bi-chevron-right sep"></i>
        <a th:href="@{/admin/sucursales}">Sucursales</a>
        <i class="bi bi-chevron-right sep"></i>
        <span class="current">Nueva</span>
    </div>

    <div class="page-header">
        <div>
            <h2 class="page-title"><i class="bi bi-building-add"></i> Nueva sucursal</h2>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card slide-up" style="max-width:560px;">
        <div class="card-body" style="padding:1.5rem;">
            <form th:action="@{/admin/sucursales/guardar}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Código *</label>
                    <input type="text" name="codigo" class="form-control" placeholder="Ej: UIO-01" required maxlength="10" pattern="^[A-Z0-9-]+$" title="Alfanumérico en mayúsculas con guiones (máx 10)">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Ciudad *</label>
                    <input type="text" name="ciudad" class="form-control" placeholder="Ej: Quito" required maxlength="100" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]+$" title="Solo letras y espacios (máx 100)">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Dirección *</label>
                    <input type="text" name="direccion" class="form-control" placeholder="Av. Principal 123..." required maxlength="255">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Teléfono *</label>
                    <input type="text" name="telefono" class="form-control" placeholder="02-2345678" required pattern="^\+?\d{7,15}$" title="De 7 a 15 dígitos numéricos, opcional + al inicio" maxlength="15">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-filled">Guardar</button>
                    <a th:href="@{/admin/sucursales}" class="btn btn-ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{layout/base :: footer}"></div>
    </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
