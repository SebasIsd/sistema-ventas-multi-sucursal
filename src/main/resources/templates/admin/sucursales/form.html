<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Nueva Sucursal — Admin')}"></head>
<body class="role-admin">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-admin}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

    <div class="breadcrumb-wrapper">
        <a th:href="@{/admin/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
        <i class="bi bi-chevron-right sep"></i>
        <a th:href="@{/admin/sucursales}">Sucursales</a>
        <i class="bi bi-chevron-right sep"></i>
        <span class="current">Nueva</span>
    </div>

    <div class="page-header">
        <div>
            <h2 class="page-title"><i class="bi bi-building-add"></i> Nueva sucursal</h2>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card slide-up" style="max-width:560px;">
        <div class="card-body" style="padding:1.5rem;">
            <form th:action="@{/admin/sucursales/guardar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" name="codigo" class="form-control" maxlength="10" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ciudad</label>
                    <input type="text" name="ciudad" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="direccion" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-filled">Guardar</button>
                    <a th:href="@{/admin/sucursales}" class="btn btn-ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{layout/base :: footer}"></div>
    </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
