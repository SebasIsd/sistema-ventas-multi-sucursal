<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Sucursal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Nueva Sucursal</h2>
        <a class="btn btn-outline-secondary" th:href="@{/admin/sucursales}">Volver</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="alert alert-info">
                Vista habilitada para resolver rutas. El guardado de sucursales puede conectarse despues al servicio correspondiente.
            </div>

            <form>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Codigo</label>
                        <input type="text" class="form-control" placeholder="SUC-001">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ciudad</label>
                        <input type="text" class="form-control" placeholder="Quito">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Telefono</label>
                        <input type="text" class="form-control" placeholder="022222222">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Direccion</label>
                        <input type="text" class="form-control" placeholder="Av. Principal y Calle Secundaria">
                    </div>
                </div>
                <button type="button" class="btn btn-primary mt-3" disabled>Guardar (pendiente)</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
