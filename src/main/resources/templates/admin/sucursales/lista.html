<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucursales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Sucursales</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-primary" th:href="@{/admin/sucursales/nueva}">Nueva Sucursal</a>
            <a class="btn btn-outline-secondary" th:href="@{/admin/dashboard}">Volver</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Codigo</th>
                    <th>Ciudad</th>
                    <th>Direccion</th>
                    <th>Telefono</th>
                    <th>Activa</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(sucursales)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay sucursales registradas.</td>
                </tr>
                <tr th:each="s : ${sucursales}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.codigo}"></td>
                    <td th:text="${s.ciudad}"></td>
                    <td th:text="${s.direccion}"></td>
                    <td th:text="${s.telefono}"></td>
                    <td>
                        <span class="badge" th:classappend="${s.activo} ? ' bg-success' : ' bg-secondary'"
                              th:text="${s.activo} ? 'SI' : 'NO'"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
