<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- =========================================================
     FRAGMENTO: head(title)
     ========================================================= -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Sistema Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons (reemplaza FontAwesome — más fiable en entornos locales) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-container">

    <!-- Sidebar fragments moved to layout/sidebars.html to avoid multiple sidebars rendering -->

    <!-- =========================================================
         SIDEBAR: Auto-select based on Role
         ========================================================= -->
    <aside th:fragment="sidebar-auto">
        <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:replace="~{layout/sidebars :: sidebar-admin}"></div>
        <div th:if="${#authorization.expression('hasRole(''BODEGA'')') and !#authorization.expression('hasRole(''ADMIN'')')}" th:replace="~{layout/sidebars :: sidebar-bodega}"></div>
        <div th:if="${#authorization.expression('hasRole(''CAJERO'')') and !#authorization.expression('hasRole(''ADMIN'')') and !#authorization.expression('hasRole(''BODEGA'')')" th:replace="~{layout/sidebars :: sidebar-cajero}"></div>
    </aside>

    <div class="main-wrapper">
        <!-- TOP BAR (Común) -->
        <header th:fragment="top-bar" class="top-bar">
            <div class="top-bar-left">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <div class="breadcrumb-wrapper d-none d-md-flex" style="margin-bottom:0">
                    <i class="bi bi-house-door"></i>
                    <span class="sep">/</span>
                    <span class="current" th:text="${title}">Dashboard</span>
                </div>
            </div>

            <div class="top-bar-right">
                <div class="user-pill">
                    <div class="user-pill-info">
                        <span class="user-pill-name" th:text="${#authentication.principal.nombreCompleto}">Admin Name</span>
                        <span class="user-pill-branch" th:text="${#authentication.principal.sucursalNombre}">Sucursal</span>
                    </div>
                    <div class="user-pill-avatar">
                        <i class="bi bi-person-circle"></i>
                    </div>
                </div>

                <form th:action="@{/auth/logout}" method="post">
                    <button type="submit" class="btn-logout-minimal" title="Cerrar Sesión">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
        </header>

        <!-- Aquí se inyectará el contenido de las páginas -->
        <!-- Las páginas individuales deben abrir .page-content -->

    </div> <!-- /main-wrapper -->

</div> <!-- /app-container -->


<!-- =========================================================
     FRAGMENTO: footer
     ========================================================= -->
<div th:fragment="footer" class="page-footer">
    &copy; 2026 Sistema de Ventas Multi-Sucursal &mdash; v2.0 Redesign
</div>


<!-- =========================================================
     FRAGMENTO: scripts
     ========================================================= -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/modules/formatters.js}"></script>
    <script th:src="@{/js/modules/toasts.js}"></script>
    <script th:src="@{/js/modules/modals.js}"></script>
    <script th:src="@{/js/modules/paginator.js}"></script>

    <script>
        /* ---- Sidebar Toggle (Mobile) ---- */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        }

        /* ---- Marcar link activo ---- */
        (function () {
            const path = window.location.pathname;
            document.querySelectorAll('.sidebar-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '#' && (path === href || (href.length > 1 && path.startsWith(href)))) {
                    link.classList.add('active');
                }
            });
        })();

        /* ---- Reloj ---- */
        function updateClock() {
            const el = document.getElementById('clockDisplay');
            if (!el) return;
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            el.textContent = now.toLocaleDateString('es-EC', {weekday:'short', day:'numeric', month:'short'}) + ' · ' + h + ':' + m;
        }
        if (document.getElementById('clockDisplay')) { updateClock(); setInterval(updateClock, 60000); }

        /* ---- Limpiar bloqueo modal ---- */
        function limpiarBloqueoModal() {
            document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
            document.body.classList.remove('modal-open');
            document.body.style.overflow = '';
            document.body.style.paddingRight = '';
        }
        document.addEventListener('DOMContentLoaded', limpiarBloqueoModal);
        window.addEventListener('pageshow', limpiarBloqueoModal);
    </script>
</div>

</body>
</html>
