<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Sistema Ventas</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- NAVBAR FRAGMENT -->
    <nav th:fragment="navbar(homeUrl, roleIcon, roleName)" class="navbar">
        <div class="navbar-inner">
            <a class="nav-brand" th:href="@{${homeUrl}}">
                <div class="brand-icon"><i class="fas fa-store"></i></div>
                Sistema Ventas
            </a>

            <div class="user-pill">
                <div class="user-avatar">
                    <i th:class="${roleIcon}"></i>
                </div>
                <div class="user-meta d-none d-sm-block">
                    <!-- Si username no está en el modelo (ej: fallo de sesión), mostramos 'Usuario' por defecto -->
                    <div class="user-name" th:text="${username != null ? username : 'Usuario'}">admin</div>
                    <span class="user-role" th:text="${roleName}">ROL</span>
                </div>

                <form th:action="@{/auth/logout}" method="post" class="d-inline ms-2">
                    <button type="submit" class="btn-logout" title="Cerrar Sesión">
                        <i class="fas fa-right-from-bracket"></i> 
                        <span class="d-none d-sm-inline">Salir</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- FOOTER FRAGMENT -->
    <div th:fragment="footer" class="page-footer">
        &copy; 2026 Sistema de Ventas Multi-Sucursal &mdash; v1.0
    </div>

    <!-- SCRIPTS FRAGMENT -->
    <div th:fragment="scripts">
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Scripts personalizados (Utilidades, Paginador, Toasts) -->
        <script th:src="@{/js/script.js}"></script>
        
        <!-- Reloj Global & Prevención BFCache -->
        <script>
            function updateClock() {
                const clockEl = document.getElementById('clockDisplay');
                if(!clockEl) return;
                const now = new Date();
                const h = String(now.getHours()).padStart(2,'0');
                const m = String(now.getMinutes()).padStart(2,'0');
                clockEl.textContent =
                    now.toLocaleDateString('es-EC', {weekday:'short', day:'numeric', month:'short'}) + ' · ' + h + ':' + m;
            }
            if(document.getElementById('clockDisplay')) {
                updateClock();
                setInterval(updateClock, 60000);
            }

            // Limpiar bloqueos de Bootstrap modal al cargar / navegar hacia atrás (bfcache)
            function limpiarBloqueoModal() {
                document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
                document.body.classList.remove('modal-open');
                document.body.style.overflow = '';
                document.body.style.paddingRight = '';
            }
            document.addEventListener('DOMContentLoaded', limpiarBloqueoModal);
            window.addEventListener('pageshow', limpiarBloqueoModal);
        </script>
    </div>

</body>
</html>
