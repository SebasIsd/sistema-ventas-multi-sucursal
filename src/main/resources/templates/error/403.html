<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Acceso Denegado — Sistema de Ventas')}"></head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--clr-dark-slate), var(--clr-slate));">
        <div style="text-align: center; padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 500px;">
            <div style="font-size: 4rem; margin-bottom: 1rem; color: var(--clr-blue);">
                <i class="bi bi-lock-fill"></i>
            </div>
            
            <h1 style="font-size: 2rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">
                Acceso Denegado
            </h1>
            
            <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; line-height: 1.5;">
                No tienes permisos para acceder a esta sección del sistema. 
                Por favor contacta al administrador si crees que debería tener acceso.
            </p>
            
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="javascript:history.back()" class="btn btn-outline" style="padding: 0.75rem 2rem; border: 2px solid var(--primary); color: var(--primary); text-decoration: none; border-radius: 8px; font-weight: 600;">
                    ← Volver Atrás
                </a>
                <a href="/dashboard" class="btn btn-filled" style="padding: 0.75rem 2rem; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">
                    Ir a Dashboard
                </a>
            </div>
            
            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0;">
                    <i class="bi bi-info-circle"></i> 
                    Tu rol: <strong th:text="${#authentication.principal.roles}">N/A</strong>
                </p>
            </div>
        </div>
    </div>
    
    <style>
        :root {
            --clr-dark-slate: #2D3F54;
            --clr-slate: #52647A;
            --clr-blue: #006ECF;
            --primary: #1DBD8E;
            --text-main: #1e293b;
            --text-muted: #52647A;
            --border: #e2e8f0;
        }
    </style>
</body>
</html>
