<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Sistema Ventas</title>
  <!-- Fuente Inter (Estándar profesional moderno) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;       /* Azul Profesional */
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;      /* Fondo gris muy suave */
      --card-bg: #ffffff;
      --text-main: #1e293b;     /* Gris oscuro casi negro */
      --text-secondary: #64748b;/* Gris medio */
      --border: #e2e8f0;
      --error: #ef4444;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* Patrón de fondo sutil opcional */
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .login-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 16px;
      box-shadow:
              0 4px 6px -1px rgba(0, 0, 0, 0.05),
              0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .logo-icon i {
      font-size: 24px;
      color: white;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .login-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      transition: color 0.2s;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px 12px 40px; /* Espacio para el icono */
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
      background: #fff;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-control:focus + i,
    .input-wrapper:focus-within i {
      color: var(--primary);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover {
      background: var(--primary-hover);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    /* Alertas */
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #a7f3d0;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo-icon">
      <i class="fas fa-store"></i>
    </div>
    <h1>Sistema Ventas</h1>
    <p>Ingresa tus credenciales para acceder</p>
  </div>

  <!-- Mensajes de error/éxito -->
  <div th:if="${param.error}" class="alert alert-error">
    <i class="fas fa-exclamation-circle"></i>
    <span>Usuario o contraseña incorrectos.</span>
  </div>

  <div th:if="${param.logout}" class="alert alert-success">
    <i class="fas fa-check-circle"></i>
    <span>Sesión cerrada correctamente.</span>
  </div>

  <form th:action="@{/auth/login}" method="post">
    <div class="form-group">
      <label for="username">Usuario</label>
      <div class="input-wrapper">
        <input type="text" id="username" name="username" class="form-control" placeholder="ej. admin" required autofocus>
        <i class="fas fa-user"></i>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        <i class="fas fa-lock"></i>
      </div>
    </div>

    <button type="submit" class="btn-login">
      Iniciar Sesión
    </button>
  </form>

  <div class="login-footer">
    <p>&copy; 2026 Sistema de Ventas Multi-Sucursal</p>
    <p style="margin-top: 5px;">
      Usuario: <strong>admin</strong> | Clave: <strong>admin123</strong>
    </p>
  </div>
</div>

</body>
</html>
