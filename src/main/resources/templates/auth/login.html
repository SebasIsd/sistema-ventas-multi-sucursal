<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Sistema de Ventas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary:       #006ECF;
      --primary-dark:  #004C94;
      --primary-light: #3C93FA;
      --accent:        #1DBD8E;
      --text-main:     #ffffff;
      --text-muted:    #cbd5e1;
      --border:        rgba(255, 255, 255, 0.2);
      --error:         #f87171;
      --success:       #34d399;
      --glass-bg:      rgba(255, 255, 255, 0.1);
      --glass-border:  rgba(255, 255, 255, 0.15);
    }

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #2D3F54 0%, #004C94 50%, #017072aa 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      position: relative;
      overflow: hidden;
    }

    /* ---- Animated background elements ---- */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    /* Glowing orbs for depth */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      animation: float 10s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; background: #01437c; top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 350px; height: 350px; background: #127759; bottom: -80px; right: -80px; animation-delay: -5s; }
    .orb-3 { width: 250px; height: 250px; background: #017870; top: 40%; right: 15%; animation-delay: -2s; }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%       { background-position: 100% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-30px) scale(1.1); }
    }

    /* ---- Card Glass Morphism ---- */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Header ---- */
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-wrap {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 25px rgba(0, 110, 207, 0.4);
    }

    .logo-wrap i { font-size: 1.8rem; color: white; }

    .login-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: white;
      letter-spacing: -.5px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    /* ---- Alerts ---- */
    .alert {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-size: .875rem;
      font-weight: 500;
      backdrop-filter: blur(8px);
    }

    .alert-error {
      background: rgba(248, 30, 30, 0.571);
      color: #fca5a5;
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .alert-success {
      background: rgba(52, 211, 153, 0.15);
      color: #a7f3d0;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    /* ---- Form ---- */
    .form-group { margin-bottom: 1.5rem; }

    .form-label {
      display: block;
      font-size: .75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.73);
      transition: color .3s;
      font-size: 1rem;
    }

    .form-input {
      width: 100%;
      height: 52px;
      padding: 0 1rem 0 3rem;
      background: rgba(255, 255, 255, 0.521);
      border: 1px solid rgba(255, 255, 255, 0.479);
      border-radius: 14px;
      font-size: 1rem;
      color: rgba(1, 1, 1, 0.755);
      transition: all .3s;
    }

    .form-input::placeholder { color: rgba(38, 38, 38, 0.718); }

    .form-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.826);
      border-color: var(--primary-light);
      box-shadow: 0 0 0 4px rgba(131, 222, 250, 0.378);
    }

    .input-wrap:focus-within i { color: var(--primary-light); }

    /* Toggle password */
    .toggle-pw {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      padding: .25rem;
      transition: color .2s;
    }
    .toggle-pw:hover { color: rgb(0, 0, 0); }

    /* ---- Submit button ---- */
    .btn-login {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .3s;
      box-shadow: 0 10px 20px -5px rgba(82, 82, 82, 0.4);
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      letter-spacing: .03em;
    }

    .btn-login:hover  { 
      transform: translateY(-2px); 
      box-shadow: 0 15px 30px -5px rgba(0, 76, 148, 0.867);
      filter: brightness(1.1);
    }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: rgb(0, 0, 0);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Footer ---- */
    .login-footer {
      text-align: center;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: .85rem;
      color: var(--text-muted);
    }

    .hint {
      display: inline-flex;
      gap: 1.25rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.6rem 1.25rem;
      border-radius: 10px;
      margin-top: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hint span { font-weight: 600; color: white; }

    @media (max-width: 480px) {
      .login-card { padding: 2.5rem 1.5rem; }
      .login-header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="logo-wrap">
        <i class="bi bi-shop"></i>
      </div>
      <h1>Sistema de Ventas</h1>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <!-- Alerts -->
    <div th:if="${param.error}" class="alert alert-error">
      <i class="bi bi-exclamation-triangle"></i>
      <span>Usuario o contraseña incorrectos. Intenta de nuevo.</span>
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
      <i class="bi bi-check-circle"></i>
      <span>Sesión cerrada correctamente.</span>
    </div>

    <!-- Form -->
    <form th:action="@{/auth/login}" method="post" id="loginForm" onsubmit="handleSubmit(event)">

      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-wrap">
          <i class="bi bi-person"></i>
          <input type="text" id="username" name="username" class="form-input"
                 placeholder="ej. admin" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="bi bi-lock"></i>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Mostrar contraseña">
            <i class="bi bi-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="spinner" id="spinner"></span>
        <i class="bi bi-arrow-right-to-bracket" id="btnIcon"></i>
        <span id="btnText">Iniciar Sesión</span>
      </button>

    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2026 Sistema de Ventas Multi-Sucursal</p>
      
    </div>

  </div>

  <script>
    function togglePw() {
      const input  = document.getElementById('password');
      const icon   = document.getElementById('pwIcon');
      const isText = input.type === 'text';
      input.type   = isText ? 'password' : 'text';
      icon.classList.toggle('bi-eye', isText);
      icon.classList.toggle('bi-eye-slash', !isText);
    }

    function handleSubmit(e) {
      const btn     = document.getElementById('btnLogin');
      const spinner = document.getElementById('spinner');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');

      btn.disabled         = true;
      spinner.style.display = 'block';
      btnIcon.style.display = 'none';
      btnText.textContent  = 'Ingresando...';
    }
  </script>

</body>
</html>
