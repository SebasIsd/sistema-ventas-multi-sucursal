<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Sistema de Ventas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary:       #7c3aed;
      --primary-dark:  #6d28d9;
      --primary-light: #ede9fe;
      --text-main:     #1e293b;
      --text-muted:    #64748b;
      --border:        #e2e8f0;
      --error:         #ef4444;
      --success:       #10b981;
    }

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      position: relative;
      overflow: hidden;
    }

    /* ---- Animated background dots ---- */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* Glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .25;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 320px; height: 320px; background: #7c3aed; top: -80px; left: -80px; animation-delay: 0s; }
    .orb-2 { width: 280px; height: 280px; background: #2563eb; bottom: -60px; right: -60px; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: #ec4899; top: 50%; right: 20%; animation-delay: -2s; }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%       { background-position: 100% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-20px) scale(1.05); }
    }

    /* ---- Card ---- */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.97);
      border-radius: 24px;
      padding: 2.75rem 2.5rem;
      box-shadow: 0 25px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.1);
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---- Header ---- */
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-wrap {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 20px rgba(124,58,237,.35);
    }

    .logo-wrap i { font-size: 1.6rem; color: white; }

    .login-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -.4px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: .9rem;
      margin-top: .3rem;
    }

    /* ---- Alerts ---- */
    .alert {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .875rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      font-size: .875rem;
      font-weight: 500;
      animation: cardIn .3s ease both;
    }

    .alert-error {
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #a7f3d0;
    }

    /* ---- Form ---- */
    .form-group { margin-bottom: 1.25rem; }

    .form-label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: .45rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      transition: color .2s;
      font-size: .9rem;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 1rem 0 2.6rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .95rem;
      color: var(--text-main);
      background: white;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(124,58,237,.12);
    }

    .input-wrap:focus-within i { color: var(--primary); }

    /* Toggle password */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: .25rem;
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--primary); }

    /* ---- Submit button ---- */
    .btn-login {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s, opacity .2s;
      box-shadow: 0 4px 14px rgba(124,58,237,.35);
      margin-top: .5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      letter-spacing: .02em;
    }

    .btn-login:hover  { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(124,58,237,.45); }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Footer ---- */
    .login-footer {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: .8rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .login-footer .hint {
      display: inline-flex;
      gap: 1rem;
      background: #f8fafc;
      padding: .5rem 1rem;
      border-radius: 8px;
      margin-top: .5rem;
      border: 1px solid var(--border);
    }

    .login-footer .hint span { font-weight: 600; color: var(--text-main); }

    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="logo-wrap">
        <i class="fas fa-store"></i>
      </div>
      <h1>Sistema de Ventas</h1>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <!-- Alerts -->
    <div th:if="${param.error}" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span>Usuario o contraseña incorrectos. Intenta de nuevo.</span>
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      <span>Sesión cerrada correctamente.</span>
    </div>

    <!-- Form -->
    <form th:action="@{/auth/login}" method="post" id="loginForm" onsubmit="handleSubmit(event)">

      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" class="form-input"
                 placeholder="ej. admin" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Mostrar contraseña">
            <i class="fas fa-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="spinner" id="spinner"></span>
        <i class="fas fa-arrow-right-to-bracket" id="btnIcon"></i>
        <span id="btnText">Iniciar Sesión</span>
      </button>

    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2026 Sistema de Ventas Multi-Sucursal</p>
      <div class="hint">
        <span>admin</span>
        <span style="color:#cbd5e1;">|</span>
        <span>admin123</span>
      </div>
    </div>

  </div>

  <script>
    function togglePw() {
      const input  = document.getElementById('password');
      const icon   = document.getElementById('pwIcon');
      const isText = input.type === 'text';
      input.type   = isText ? 'password' : 'text';
      icon.classList.toggle('fa-eye', isText);
      icon.classList.toggle('fa-eye-slash', !isText);
    }

    function handleSubmit(e) {
      const btn     = document.getElementById('btnLogin');
      const spinner = document.getElementById('spinner');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');

      btn.disabled         = true;
      spinner.style.display = 'block';
      btnIcon.style.display = 'none';
      btnText.textContent  = 'Ingresando...';
    }
  </script>

</body>
</html>
