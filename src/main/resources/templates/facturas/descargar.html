<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="mb-3">Descargar factura en PDF</h3>
                    <p class="text-muted">Ingresa el ID de la venta para generar y descargar el archivo PDF.</p>

                    <form method="get"
                          th:onsubmit="|this.action='${#httpServletRequest.contextPath}/facturas/descargar/' + document.getElementById('ventaId').value;|">
                        <div class="mb-3">
                            <label for="ventaId" class="form-label">ID de venta</label>
                            <input id="ventaId" name="ventaId" class="form-control" type="number" min="1" required>
                        </div>
                        <button class="btn btn-primary" type="submit">Generar y descargar</button>
                        <a class="btn btn-outline-secondary ms-2" th:href="@{/ventas/historial}">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
