<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
            <h4 class="mb-3">Factura de venta #<span th:text="${ventaId}">0</span></h4>

            <div th:if="${factura != null}" class="mb-3">
                <p class="mb-1"><strong>Número:</strong> <span th:text="${factura.numeroFactura}"></span></p>
                <p class="mb-1"><strong>Clave de acceso:</strong> <span th:text="${factura.claveAcceso}"></span></p>
                <p class="mb-1"><strong>Estado SRI:</strong> <span class="badge bg-info" th:text="${factura.estadoSri}"></span></p>
                <p class="mb-1" th:if="${factura.numeroAutorizacion != null}">
                    <strong>Autorización:</strong> <span th:text="${factura.numeroAutorizacion}"></span>
                </p>
            </div>

            <div th:if="${factura == null}" class="alert alert-warning mb-3">
                Aún no existe una factura registrada para esta venta. Se creará al visualizar el PDF.
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-primary" th:href="@{/facturas/descargar/{ventaId}(ventaId=${ventaId})}">Descargar PDF</a>
                <form th:action="@{/facturas/enviar-sri/{ventaId}(ventaId=${ventaId})}" method="post" class="m-0">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-success" type="submit">Enviar SRI</button>
                </form>
                <a class="btn btn-outline-secondary" th:href="@{/ventas/historial}">Volver al historial</a>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-3">
            <iframe class="pdf-viewer"
                    th:src="@{/facturas/ver/{ventaId}/pdf(ventaId=${ventaId})}"
                    title="Vista previa de factura">
            </iframe>
        </div>
    </div>
</div>
</body>
</html>
