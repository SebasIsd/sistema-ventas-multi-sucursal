<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Transferencias — Bodega')}"></head>
<body class="role-bodega">

<div class="app-container">
    <aside th:replace="~{layout/base :: sidebar-bodega}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/base :: top-bar}"></header>
        <div class="page-content">

    <div class="breadcrumb-wrapper">
        <a th:href="@{/bodega/dashboard}"><i class="bi bi-house-door"></i> Inicio</a>
        <i class="bi bi-chevron-right sep"></i>
        <span class="current">Transferencias</span>
    </div>

    <div class="page-header">
        <div>
            <h2 class="page-title"><i class="bi bi-arrow-left-right"></i> Transferir stock</h2>
            <p class="page-desc">Origen: <strong th:text="${sucursalOrigen.ciudad}">—</strong></p>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card slide-up" style="max-width:560px;">
        <div class="card-body" style="padding:1.5rem;">
            <form th:action="@{/bodega/transferencias}" method="post" id="formTransferenciaStockViejo">
                <div class="mb-3">
                    <label class="form-label">Producto</label>
                    <select name="productoId" id="selProducto" class="form-select" required>
                        <option value="">-- Seleccione --</option>
                        <option th:each="inv : ${inventarios}"
                                th:value="${inv.producto.idProducto}"
                                th:data-stock="${inv.stockActual}"
                                th:text="${inv.producto.nombre + ' (Stock: ' + inv.stockActual + ')'}">
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sucursal destino</label>
                    <select name="sucursalDestinoId" id="selDestino" class="form-select" required>
                        <option value="">-- Seleccione --</option>
                        <option th:each="s : ${sucursales}" th:value="${s.id}" th:text="${s.ciudad + ' (' + s.codigo + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" name="cantidad" id="inputCantidad" class="form-control" min="1" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-filled"><i class="bi bi-arrow-left-right"></i> Transferir</button>
                    <a th:href="@{/bodega/dashboard}" class="btn btn-ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{layout/base :: footer}"></div>
    </div>
    </div>
</div>
<div th:replace="~{layout/base :: scripts}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('formTransferenciaStockViejo');
        const cantidadInput = document.getElementById('inputCantidad');
        const selectProducto = document.getElementById('selProducto');
        const selectDestino = document.getElementById('selDestino');

        if (cantidadInput) {
            cantidadInput.addEventListener('input', function () {
                let rawVal = this.value;
                if (/[^0-9]/.test(rawVal)) {
                    this.value = rawVal.replace(/[^0-9]/g, '');
                }
            });
        }

        if (form) {
            form.addEventListener('submit', function (e) {
                const prodOption = selectProducto.options[selectProducto.selectedIndex];
                const destVal = selectDestino.value;
                const rawCant = cantidadInput.value;
                const cant = parseInt(rawCant) || 0;

                if (!prodOption || !prodOption.value) {
                    e.preventDefault();
                    showToast('error', 'Debe seleccionar un producto.');
                    return;
                }

                if (!destVal) {
                    e.preventDefault();
                    showToast('error', 'Debe seleccionar una sucursal de destino.');
                    return;
                }

                if (cant < 1) {
                    e.preventDefault();
                    showToast('error', 'La cantidad debe ser un entero positivo mayor o igual a 1.');
                    return;
                }

                const stockDisponible = parseInt(prodOption.getAttribute('data-stock')) || 0;
                if (cant > stockDisponible) {
                    e.preventDefault();
                    showToast('error', 'Stock insuficiente para transferir. Stock disponible: ' + stockDisponible);
                    return;
                }
            });
        }
    });
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function () {
        const errorMsg = /*[[${errorMessage}]]*/ null;
        const successMsg = /*[[${successMessage}]]*/ null;
        const msg = /*[[${mensaje}]]*/ null;
        const tipoMsg = /*[[${tipoMensaje}]]*/ null;

        if (errorMsg) {
            showToast('error', errorMsg);
        }
        if (successMsg) {
            showToast('success', successMsg);
        }
        if (msg) {
            showToast(tipoMsg === 'success' ? 'success' : 'error', msg);
        }
    });
    /*]]>*/
</script>
</body>
</html>
