<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Nueva Transferencia</title>
</head>
<body>

<h1>Nueva Transferencia de Inventario</h1>

<form th:action="@{/bodega/inventario/transferencia}" method="post">

  <label>Producto:</label>
  <select name="productoId" required>
    <option th:each="p : ${productos}"
            th:value="${p.idProducto}"
            th:text="${p.nombre}">
    </option>
  </select>

  <br><br>

  <label>Sucursal origen:</label>
  <select name="sucursalOrigenId" required>
    <option th:each="s : ${sucursales}"
            th:value="${s.id}"
            th:text="${s.ciudad}">
    </option>
  </select>

  <br><br>

  <label>Sucursal destino:</label>
  <select name="sucursalDestinoId" required>
    <option th:each="s : ${sucursales}"
            th:value="${s.id}"
            th:text="${s.ciudad}">
    </option>
  </select>

  <br><br>

  <label>Cantidad:</label>
  <input type="number" name="cantidad" required min="1">

  <br><br>

  <label>Observación:</label>
  <input type="text" name="observacion">

  <br><br>

  <button type="submit">Procesar Transferencia</button>

</form>

<br>

<a href="/bodega/inventario">Volver</a>

</body>
</html>
